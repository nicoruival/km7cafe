<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Km7 Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --km7-brown: #4e342e; }
        body { background: #f8f9fa; padding-bottom: 80px; font-family: sans-serif; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 12px; color: #aaa; border: none; background: none; font-size: 0.75rem; }
        .nav-item.active { color: var(--km7-brown); font-weight: bold; }
        .nav-item i { font-size: 1.4rem; display: block; }
        .view-section { display: none; padding: 20px; }
        .active-section { display: block; }
        .card-custom { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-secondary mb-2"></div>
    <p>Conectando con la tostadora...</p>
</div>

<div class="container mt-2">
    <div id="sec-venta" class="view-section active-section">
        <h5 class="fw-bold mb-3 text-center">☕ Km7 Fleet</h5>
        <div class="card-custom">
            <label class="small fw-bold text-muted">CLIENTE</label>
            <select id="clienteSel" class="form-select mb-3 border-0 bg-light"></select>
            <label class="small fw-bold text-muted">PRODUCTO</label>
            <div class="d-flex gap-2 mb-2">
                <select id="prodSel" class="form-select border-0 bg-light"></select>
                <input type="number" id="cant" class="form-control w-25 border-0 bg-light text-center" value="1">
                <button class="btn btn-dark" onclick="addItem()">+</button>
            </div>
            <input type="text" id="notaVenta" class="form-control border-0 bg-light mt-2" placeholder="Notas...">
        </div>
        <div id="listaItems"></div>
        <div class="card-custom bg-dark text-white d-flex justify-content-between align-items-center mt-3 shadow-lg">
            <div><small>Total</small><h4 class="m-0">$<span id="totalVenta">0</span></h4></div>
            <button class="btn btn-primary px-4" onclick="enviarVenta()">LISTO</button>
        </div>
    </div>

    <div id="sec-historial" class="view-section"><h5 class="fw-bold">Historial</h5><div id="contenedorHistorial"></div></div>
    <div id="sec-crm" class="view-section"><h5 class="fw-bold">CRM</h5><div id="listaP"></div></div>
    <div id="sec-caja" class="view-section"><div class="card-custom bg-dark text-white text-center">Saldo<h2 id="cajaSaldo">$0</h2></div><div id="listaMovs" class="mt-3"></div></div>
</div>

<nav class="nav-bottom">
    <button class="nav-item active" onclick="ver('sec-venta', this)"><i class="bi bi-plus-circle"></i>Venta</button>
    <button class="nav-item" onclick="ver('sec-historial', this); loadHist();"><i class="bi bi-receipt"></i>Historial</button>
    <button class="nav-item" onclick="ver('sec-crm', this); loadCRM();"><i class="bi bi-people"></i>CRM</button>
    <button class="nav-item" onclick="ver('sec-caja', this); loadCaja();"><i class="bi bi-wallet2"></i>Caja</button>
</nav>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxq69gkGczhOf683lUZXDpPPAofrcZSOdhFBvijAou44ZGFYadgeIrH_zG_SwlJtBuc/exec";
    let productos = [], clientes = [], prospectos = [], carrito = [];

    // FUNCIÓN PARA SALTAR CORS (JSONP)
    function callAPI(action, data = null) {
        return new Promise((resolve, reject) => {
            const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
            window[callbackName] = (res) => {
                delete window[callbackName];
                document.body.removeChild(script);
                resolve(res);
            };
            let url = `${API_URL}?action=${action}&callback=${callbackName}`;
            if (data) url += `&data=${encodeURIComponent(JSON.stringify(data))}`;
            const script = document.createElement('script');
            script.src = url;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }

    window.onload = async () => {
        try {
            const d = await callAPI('getFormData');
            productos = d.productos;
            clientes = d.clientes;
            prospectos = d.prospectos;
            document.getElementById('clienteSel').innerHTML = clientes.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
            document.getElementById('prodSel').innerHTML = productos.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
            document.getElementById('loader').style.display = 'none';
        } catch (e) { alert("Error de conexión inicial"); }
    };

    function addItem() {
        const clie = clientes.find(c => c[0] == document.getElementById('clienteSel').value);
        const prod = productos.find(p => p[0] == document.getElementById('prodSel').value);
        const esM = clie && clie[2] === "Mayorista";
        const precio = parseFloat(esM ? prod[6] : prod[5]);
        const cant = parseFloat(document.getElementById('cant').value);
        carrito.push({ idProd: prod[0], nombre: prod[1], cant, precio, subtotal: cant * precio });
        renderCar();
    }

    function renderCar() {
        let h = '', t = 0;
        carrito.forEach((i, idx) => {
            t += i.subtotal;
            h += `<div class="card-custom py-2 d-flex justify-content-between align-items-center">
                <span>${i.nombre} (x${i.cant})</span>
                <b>$${i.subtotal.toLocaleString()} <i class="bi bi-trash text-danger ms-2" onclick="carrito.splice(${idx},1);renderCar()"></i></b>
            </div>`;
        });
        document.getElementById('listaItems').innerHTML = h;
        document.getElementById('totalVenta').innerText = t.toLocaleString();
    }

    async function enviarVenta() {
        if(!carrito.length) return;
        document.getElementById('loader').style.display = 'flex';
        const d = { idCliente: document.getElementById('clienteSel').value, total: document.getElementById('totalVenta').innerText, estadoPago: 'Pendiente', estadoEntrega: 'Pendiente', nota: document.getElementById('notaVenta').value, items: carrito };
        const res = await callAPI('registrarVenta', d);
        alert(res.message);
        carrito = []; renderCar();
        document.getElementById('loader').style.display = 'none';
    }

    async function loadHist() {
        const d = await callAPI('getHistorial');
        document.getElementById('contenedorHistorial').innerHTML = d.map(v => `
            <div class="card-custom">
                <div class="d-flex justify-content-between"><b>${v.clienteNombre}</b> <small>${v.pago}</small></div>
                <div class="d-flex justify-content-between mt-2"><span>${v.entrega}</span><b>$${v.total}</b></div>
            </div>`).join('');
    }

    function loadCRM() {
        document.getElementById('listaP').innerHTML = prospectos.map(p => `
            <div class="card-custom border-start border-4 ${p[7]=='caliente'?'border-danger':'border-info'}">
                <b>${p[1]}</b><br><small>${p[2]}</small>
            </div>`).join('');
    }

    async function loadCaja() {
        const d = await callAPI('getCaja');
        document.getElementById('cajaSaldo').innerText = '$' + d.saldoActual.toLocaleString();
        document.getElementById('listaMovs').innerHTML = d.movimientos.map(m => `
            <div class="card-custom d-flex justify-content-between py-2">
                <small>${m[3]}</small><b>$${m[4]}</b>
            </div>`).join('');
    }

    function ver(id, el) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
