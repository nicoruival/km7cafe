<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Km7 Fleet v19.7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --km7-coffee: #2C1B0E; --km7-gold: #BC955C; --km7-bg: #FAF9F6; --km7-card: #FFFFFF; }
        body { background: var(--km7-bg); padding-bottom: 110px; padding-top: 75px; font-family: 'Segoe UI', sans-serif; color: var(--km7-coffee); }
        .app-header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(250, 249, 246, 0.85); backdrop-filter: blur(12px); z-index: 1050; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(44, 27, 14, 0.05); }
        .header-logo { font-weight: 900; color: var(--km7-coffee); }
        .header-user { width: 36px; height: 36px; background: var(--km7-coffee); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 2px solid var(--km7-gold); }
        .nav-bottom { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 75px; background: var(--km7-coffee); display: flex; border-radius: 25px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 0 10px; }
        .nav-item { flex: 1; text-align: center; color: rgba(255,255,255,0.4); border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-item i { font-size: 24px; margin-bottom: 4px; }
        .nav-item span { font-size: 11px; font-weight: 600; }
        .nav-item.active { color: white; }
        .nav-item.active i { color: var(--km7-gold); }
        
        .hist-card { background: var(--km7-card); border-radius: 18px; padding: 14px; margin-bottom: 12px; border: none; box-shadow: 0 4px 15px rgba(44, 27, 14, 0.04); border-left: 5px solid #eee; position: relative; }
        .pend-entrega { border-left-color: #f39c12; }
        .listo-entrega { border-left-color: #28a745; }
        .btn-action-small { width: 36px; height: 36px; border-radius: 10px; border: none; background: #f8f9fa; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: 0.2s; }
        .btn-ws { background: #eaffea; color: #25d366; }
        .status-pill { padding: 3px 8px; border-radius: 10px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
        .pill-pagado { background: #e8f5e9; color: #2e7d32; }
        .pill-pendiente { background: #fff3e0; color: #ef6c00; }
        .pill-entrega { background: #f0f0f0; color: #555; margin-left: 4px; }
        .btn-filter { background: white; border: none; transition: 0.3s; color: #666; }
        .btn-filter-active { background: var(--km7-coffee) !important; color: white !important; transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important; }

        .view-section { display: none; padding: 15px; animation: slideUp 0.3s ease-out; }
        .active-section { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-custom { background: var(--km7-card); border-radius: 22px; padding: 20px; margin-bottom: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .card-saldo { border-radius: 22px; padding: 22px; color: white; margin-bottom: 10px; }
        .bg-caja { background: linear-gradient(135deg, #2C1B0E, #4e342e); }
        .bg-pendiente { background: linear-gradient(135deg, #BC955C, #8a7100); }
        .btn-km7 { background: var(--km7-coffee); color: white; border-radius: 14px; font-weight: 700; padding: 14px; border: none; width: 100%; }
        .form-label-small { font-size: 10px; font-weight: 800; color: var(--km7-gold); text-transform: uppercase; margin-bottom: 6px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--km7-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header class="app-header">
    <div style="font-size:9px; font-weight:800; color:#ccc;">v19.7</div>
    <div class="header-logo">KM7 <span style="font-weight:300; color:var(--km7-gold)">CAFÉ</span></div>
    <div class="header-user">NR</div>
</header>

<div id="loader">
    <div class="spinner-border text-dark mb-3"></div>
    <h6 class="fw-bold">KM7 COFFEE ROASTER</h6>
</div>

<div class="container">
    <div id="sec-venta" class="view-section active-section">
        <h5 class="fw-bold mb-3">Nueva Orden</h5>
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label-small">Cliente</label>
                <button class="btn btn-link p-0 text-decoration-none fw-bold" style="font-size: 10px; color: var(--km7-coffee);" onclick="modals.clie.show()">+ NUEVO CLIENTE</button>
            </div>
            <select id="clienteSel" class="form-select border-0 bg-light mb-3"></select>
            <label class="form-label-small">Producto</label>
            <div class="d-flex gap-2 mb-3"><select id="prodSel" class="form-select border-0 bg-light"></select><input type="number" id="cant" class="form-control w-25 border-0 bg-light text-center" value="1"><button class="btn btn-dark" onclick="addItem()"><i class="bi bi-plus-lg"></i></button></div>
            <div class="row g-2">
                <div class="col-6"><label class="form-label-small">Entrega</label><select id="estadoEntrega" class="form-select border-0 bg-light"><option>Pendiente</option><option>Entregado</option></select></div>
                <div class="col-6"><label class="form-label-small">Pago</label><select id="estadoPago" class="form-select border-0 bg-light" onchange="toggleMedioPago()"><option>Pendiente</option><option>Pagado</option></select></div>
            </div>
            <div id="divMedioPago" class="mt-3 hidden"><label class="form-label-small">Medio</label><select id="medioPago" class="form-select border-0 bg-light"><option>Efectivo</option><option>Transferencia</option></select></div>
            <div class="mt-3"><label class="form-label-small">Descuento ($)</label><input type="number" id="descValor" class="form-control border-0 bg-light" placeholder="0" oninput="renderCar()"></div>
            <input type="text" id="notaVenta" class="form-control border-0 bg-light mt-3" placeholder="Notas...">
        </div>
        <div id="listaItems"></div>
        <div class="card-custom bg-dark text-white d-flex justify-content-between align-items-center mt-3 shadow-lg" style="background:var(--km7-coffee) !important">
            <div><small class="opacity-75">TOTAL</small><h3 class="m-0 fw-bold">$<span id="totalVenta">0</span></h3></div>
            <button class="btn btn-km7 px-4 py-2" style="width:auto; background:var(--km7-gold)" onclick="enviarVenta()">LISTO</button>
        </div>
    </div>

    <div id="sec-historial" class="view-section">
        <h5 class="fw-bold mb-3">Ventas</h5>
        <div class="d-flex gap-2 mb-3">
            <input type="text" id="busqHist" class="form-control border-0 bg-white shadow-sm" placeholder="Buscar..." oninput="renderHist()">
            <button id="fEnt" class="btn btn-filter shadow-sm" onclick="toggleF('entrega')"><i class="bi bi-truck"></i></button>
            <button id="fPag" class="btn btn-filter shadow-sm" onclick="toggleF('pago')"><i class="bi bi-cash-stack"></i></button>
        </div>
        <div id="contenedorHistorial"></div>
    </div>

    <div id="sec-crm" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0">Prospectos</h5>
            <button class="btn btn-dark btn-sm rounded-pill px-3" onclick="modals.prsp.show()">+ NUEVO</button>
        </div>
        <div id="listaP"></div>
    </div>

    <div id="sec-caja" class="view-section">
        <div class="row g-2 mb-3">
            <div class="col-6"><div class="card-saldo bg-caja shadow-sm"><small class="opacity-75">CAJA REAL</small><h4 id="cajaSaldo" class="fw-bold m-0">$0</h4></div></div>
            <div class="col-6"><div class="card-saldo bg-pendiente shadow-sm" style="cursor: pointer" onclick="modals.deuda.show()"><small class="opacity-75">DEUDA CLIENTES</small><h4 id="cajaPendiente" class="fw-bold m-0">$0</h4></div></div>
        </div>
        <button class="btn btn-outline-danger w-100 mb-4 fw-bold border-2 py-3" onclick="modals.gasto.show()">
            <i class="bi bi-dash-circle me-2"></i>REGISTRAR GASTO
        </button>
        <div id="listaMovs"></div>
    </div>
</div>

<nav class="nav-bottom">
    <button class="nav-item active" onclick="ver('sec-venta', this)"><i class="bi bi-cup-hot-fill"></i><span>VENTA</span></button>
    <button class="nav-item" onclick="ver('sec-historial', this); loadHist();"><i class="bi bi-receipt-cutoff"></i><span>VENTAS</span></button>
    <button class="nav-item" onclick="ver('sec-crm', this); loadCRM();"><i class="bi bi-person-lines-fill"></i><span>CRM</span></button>
    <button class="nav-item" onclick="ver('sec-caja', this); loadCaja();"><i class="bi bi-wallet2"></i><span>CAJA</span></button>
</nav>

<div class="modal fade" id="modDeuda" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4 border-0"><h5 class="fw-bold mb-3 text-center">Detalle de Deudas</h5><div id="contDeudas" class="mb-3"></div><button class="btn btn-km7" data-bs-dismiss="modal">CERRAR</button></div></div></div>
<div class="modal fade" id="modEditItem" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4"><h6 class="fw-bold mb-3">Editar Item</h6><input type="number" id="editCant" class="form-control mb-2"><input type="number" id="editPrecio" class="form-control mb-3"><div class="d-flex gap-2"><button class="btn btn-danger flex-grow-1" onclick="carrito.splice(editingIdx,1); renderCar(); modals.edit.hide();">Borrar</button><button class="btn btn-km7 flex-grow-1" onclick="saveEditItem()">Guardar</button></div></div></div></div>
<div class="modal fade" id="modCliente" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4 border-0"><h5 class="fw-bold mb-3">Nuevo Cliente</h5><input type="text" id="ncNombre" class="form-control mb-2" placeholder="Nombre"><select id="ncCat" class="form-select mb-2"><option>Minorista</option><option>Mayorista</option></select><input type="tel" id="ncTel" class="form-control mb-3" placeholder="Teléfono"><button class="btn btn-km7" onclick="crearClie()">GUARDAR</button></div></div></div>
<div class="modal fade" id="modProspecto" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4 border-0"><h5 class="fw-bold mb-3">Nuevo Prospecto</h5><input type="text" id="npNombre" class="form-control mb-2" placeholder="Nombre/Lugar"><input type="tel" id="npTel" class="form-control mb-3" placeholder="WhatsApp"><button class="btn btn-km7" onclick="crearPrsp()">AÑADIR</button></div></div></div>
<div class="modal fade" id="modGasto" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4 border-0"><h5 class="fw-bold mb-3">Registrar Gasto</h5><input type="number" id="gMonto" class="form-control mb-2" placeholder="Monto"><input type="text" id="gNota" class="form-control mb-3" placeholder="Concepto"><button class="btn btn-danger w-100 py-3" onclick="guardarGasto()">REGISTRAR GASTO</button></div></div></div>
<div class="modal fade" id="modLogs" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content p-4 rounded-4 border-0"><h6 class="fw-bold mb-3">Seguimiento</h6><div id="contLogs" class="mb-3"></div><input type="text" id="logGest" class="form-control mb-2" placeholder="¿Qué se habló?"><button class="btn btn-km7" onclick="addLog()">Agregar</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxq69gkGczhOf683lUZXDpPPAofrcZSOdhFBvijAou44ZGFYadgeIrH_zG_SwlJtBuc/exec";
    let productos = [], clientes = [], carrito = [], histData = [], prospectos = [], curPrspId = "";
    let fEntAct = false, fPagAct = false, editingIdx = -1;
    const modals = { edit: new bootstrap.Modal('#modEditItem'), clie: new bootstrap.Modal('#modCliente'), prsp: new bootstrap.Modal('#modProspecto'), gasto: new bootstrap.Modal('#modGasto'), logs: new bootstrap.Modal('#modLogs'), deuda: new bootstrap.Modal('#modDeuda') };

    function callAPI(action, data = null, id = null, extra = null, val = null) {
        return new Promise((resolve) => {
            const cb = 'jsonp_' + Math.round(100000 * Math.random());
            window[cb] = (res) => { delete window[cb]; document.body.removeChild(s); resolve(res); };
            let url = `${API_URL}?action=${action}&callback=${cb}`;
            if (data) url += `&data=${encodeURIComponent(JSON.stringify(data))}`;
            if (id) url += `&id=${id}`;
            if (extra) url += `&tipo=${extra}`;
            if (val) url += `&valor=${val}`;
            const s = document.createElement('script'); s.src = url; document.body.appendChild(s);
        });
    }

    window.onload = async () => {
        const d = await callAPI('getFormData');
        productos = d.productos; clientes = d.clientes; prospectos = d.prospectos;
        document.getElementById('clienteSel').innerHTML = clientes.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
        document.getElementById('prodSel').innerHTML = productos.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
        document.getElementById('loader').style.display = 'none';
    };

    function addItem() {
        const prod = productos.find(p => p[0] == document.getElementById('prodSel').value);
        const clie = clientes.find(c => c[0] == document.getElementById('clienteSel').value);
        const p = parseFloat(clie[2] === "Mayorista" ? prod[6] : prod[5]);
        carrito.push({ idProd: prod[0], nombre: prod[1], cant: document.getElementById('cant').value, precio: p, subtotal: p * document.getElementById('cant').value });
        renderCar();
    }
    function renderCar() {
        let h = '', st = 0;
        carrito.forEach((i, idx) => { st += i.subtotal; h += `<div class="card-custom py-2 d-flex justify-content-between align-items-center mb-2" onclick="openEditItem(${idx})"><span><b>${i.nombre}</b> x${i.cant}</span><b>$${i.subtotal.toLocaleString()}</b></div>`; });
        const desc = parseFloat(document.getElementById('descValor').value) || 0;
        document.getElementById('listaItems').innerHTML = h;
        document.getElementById('totalVenta').innerText = (st - desc).toLocaleString();
    }
    function openEditItem(idx) { editingIdx = idx; document.getElementById('editCant').value = carrito[idx].cant; document.getElementById('editPrecio').value = carrito[idx].precio; modals.edit.show(); }
    function saveEditItem() { carrito[editingIdx].cant = document.getElementById('editCant').value; carrito[editingIdx].precio = document.getElementById('editPrecio').value; carrito[editingIdx].subtotal = carrito[editingIdx].cant * carrito[editingIdx].precio; renderCar(); modals.edit.hide(); }

    async function loadCaja() {
        const d = await callAPI('getCaja');
        document.getElementById('cajaSaldo').innerText = '$' + d.saldoActual.toLocaleString();
        document.getElementById('cajaPendiente').innerText = '$' + d.pendienteCobro.toLocaleString();
        
        // Carga el detalle en el modal de deudas
        document.getElementById('contDeudas').innerHTML = d.detallesPendientes.length > 0 
            ? d.detallesPendientes.map(p => `<div class="d-flex justify-content-between border-bottom py-2"><span style="font-size:13px">${p.cliente}</span><b style="font-size:13px">$${p.monto}</b></div>`).join('')
            : '<p class="text-center text-muted">No hay deudas pendientes</p>';

        document.getElementById('listaMovs').innerHTML = d.movimientos.map(m => `
            <div class="card-custom py-2 d-flex justify-content-between border-start border-4 ${m.tipo=='Egreso'?'border-danger':'border-success'}">
                <div class="d-flex flex-column">
                    <span style="font-size:13px; font-weight:800">${m.tipo.toUpperCase()}: ${m.descripcion}</span>
                    <small class="text-muted" style="font-size:10px">${m.fecha} | Pago: ${m.medio}</small>
                    ${m.nota ? `<small class="text-primary" style="font-size:10px; font-style:italic">Nota: ${m.nota}</small>` : ''}
                </div>
                <b class="${m.tipo=='Egreso'?'text-danger':'text-success'}">${m.tipo=='Egreso'?'-':''}$${m.monto}</b>
            </div>`).join('');
    }

    async function guardarGasto() {
        const m = document.getElementById('gMonto').value; const n = document.getElementById('gNota').value;
        if(!m || !n) return alert("Completar monto y concepto");
        document.getElementById('loader').style.display = 'flex';
        await callAPI('registrarGasto', { monto: m, nota: n, medioPago: 'Efectivo' });
        modals.gasto.hide(); await loadCaja();
        document.getElementById('loader').style.display = 'none';
    }

    async function loadHist() { histData = await callAPI('getHistorial'); renderHist(); }
    function renderHist() {
        const b = document.getElementById('busqHist').value.toLowerCase();
        document.getElementById('contenedorHistorial').innerHTML = histData
            .filter(v => v.clienteNombre.toLowerCase().includes(b))
            .filter(v => !fEntAct || v.entrega === 'Pendiente')
            .filter(v => !fPagAct || v.pago === 'Pendiente')
            .map(v => `
                <div class="hist-card ${v.entrega==='Entregado'?'listo-entrega':'pend-entrega'}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex flex-column">
                            <b style="font-size:14px">${v.clienteNombre}</b>
                            <small class="text-muted" style="font-size:9px">${v.fecha}</small>
                        </div>
                        <b style="font-size:14px">$${v.total}</b>
                    </div>
                    <div class="my-2 d-flex align-items-center">
                        <span class="status-pill ${v.pago==='Pagado'?'pill-pagado':'pill-pendiente'}">${v.pago}</span>
                        <span class="status-pill pill-entrega">${v.entrega}</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn-action-small" onclick="updStat('${v.id}','pago','${v.pago}')"><i class="bi bi-cash"></i></button>
                        <button class="btn-action-small" onclick="updStat('${v.id}','entrega','${v.entrega}')"><i class="bi bi-truck"></i></button>
                        <button class="btn-action-small btn-ws" onclick="shareVenta('${v.id}')"><i class="bi bi-whatsapp"></i></button>
                    </div>
                </div>`).join('');
    }

    function shareVenta(id) {
        const v = histData.find(x => x.id === id); if(!v) return;
        const msg = `*KM7 COFFEE ROASTERS*\n------------------\n📅 *Fecha:* ${v.fecha}\n👤 *Cliente:* ${v.clienteNombre}\n☕ *Productos:* ${v.productos}\n📝 *Nota:* ${v.nota || '-'}\n💰 *Desc:* $${v.descuento || '0'}\n✅ *TOTAL:* $${v.total}\n------------------\n_¡Gracias por tu compra!_`;
        window.open(`https://wa.me/${v.clienteTel.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
    }
    async function updStat(id, t, v) {
        const nv = (t==='pago') ? (v==='Pagado'?'Pendiente':'Pagado') : (v==='Entregado'?'Pendiente':'Entregado');
        document.getElementById('loader').style.display='flex'; await callAPI('updateStatusVenta', null, id, t, nv); await loadHist(); document.getElementById('loader').style.display='none';
    }
    async function loadCRM() {
        const d = await callAPI('getFormData'); prospectos = d.prospectos;
        document.getElementById('listaP').innerHTML = prospectos.map(p => `<div class="crm-card"><div class="d-flex justify-content-between"><h6>${p[1]}</h6><span>${p[7]}</span></div><button class="btn btn-sm btn-outline-dark w-100" onclick="openLogs('${p[0]}')">Logs</button></div>`).join('');
    }
    async function openLogs(id) { curPrspId = id; modals.logs.show(); const l = await callAPI('getSeguimientos', null, id); document.getElementById('contLogs').innerHTML = l.map(x => `<div>${x[4]}</div>`).join(''); }
    async function addLog() { await callAPI('agregarLogCRM', { idProspecto: curPrspId, gestion: document.getElementById('logGest').value }); document.getElementById('logGest').value=""; openLogs(curPrspId); }
    function ver(id, el) { document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-section')); document.getElementById(id).classList.add('active-section'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
    function toggleMedioPago() { document.getElementById('divMedioPago').classList.toggle('hidden', document.getElementById('estadoPago').value !== 'Pagado'); }
    
    function toggleF(tipo) { 
        if(tipo === 'entrega') { fEntAct = !fEntAct; document.getElementById('fEnt').classList.toggle('btn-filter-active', fEntAct); } 
        if(tipo === 'pago') { fPagAct = !fPagAct; document.getElementById('fPag').classList.toggle('btn-filter-active', fPagAct); } 
        renderHist(); 
    }

    async function enviarVenta() {
        document.getElementById('loader').style.display='flex';
        const totalV = document.getElementById('totalVenta').innerText.replace(/\./g, '');
        await callAPI('registrarVenta', { idCliente: document.getElementById('clienteSel').value, total: totalV, estadoPago: document.getElementById('estadoPago').value, estadoEntrega: document.getElementById('estadoEntrega').value, medioPago: document.getElementById('medioPago').value, nota: document.getElementById('notaVenta').value, descuento: document.getElementById('descValor').value, items: carrito });
        location.reload();
    }
    async function crearClie() { await callAPI('crearCliente', { nombre: document.getElementById('ncNombre').value, cat: document.getElementById('ncCat').value, tel: document.getElementById('ncTel').value }); location.reload(); }
    async function crearPrsp() { await callAPI('crearProspecto', { nombre: document.getElementById('npNombre').value, tel: document.getElementById('npTel').value, temp: "Frío" }); location.reload(); }
</script>
</body>
</html>
