<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Km7 Fleet v18.6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --km7-coffee: #2C1B0E; --km7-gold: #BC955C; --km7-bg: #FAF9F6; --km7-card: #FFFFFF; --status-ok: #28a745; --status-wait: #f39c12; }
        body { background: var(--km7-bg); padding-bottom: 110px; padding-top: 75px; font-family: 'Segoe UI', sans-serif; color: var(--km7-coffee); }
        .app-header { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(250, 249, 246, 0.85); backdrop-filter: blur(12px); z-index: 1050; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(44,27,14,0.05); }
        .header-logo { font-weight: 900; color: var(--km7-coffee); }
        .hist-card { background: var(--km7-card); border-radius: 20px; padding: 18px; margin-bottom: 16px; border: none; box-shadow: 0 8px 20px rgba(44,27,14,0.04); border-left: 6px solid #eee; }
        .hist-card.pend-entrega { border-left-color: var(--status-wait); }
        .hist-card.listo-entrega { border-left-color: var(--status-ok); }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .pill-pagado { background: #e8f5e9; color: #2e7d32; }
        .pill-pendiente { background: #fff3e0; color: #ef6c00; }
        .btn-action-small { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #eee; background: white; display: flex; align-items: center; justify-content: center; }
        .nav-bottom { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 65px; background: var(--km7-coffee); display: flex; border-radius: 22px; z-index: 1000; box-shadow: 0 12px 30px rgba(44,27,14,0.25); }
        .nav-item { flex: 1; text-align: center; color: rgba(255,255,255,0.35); border: none; background: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-item.active { color: white; }
        .view-section { display: none; padding: 15px; animation: slideUp 0.3s; }
        .active-section { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-custom { background: white; border-radius: 22px; padding: 20px; margin-bottom: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .btn-km7 { background: var(--km7-coffee); color: white; border-radius: 14px; font-weight: 700; padding: 14px; width: 100%; border: none; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--km7-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header class="app-header">
    <div style="font-size:9px; color:#ccc;">v18.6</div>
    <div class="header-logo">KM7 <span style="font-weight:300; color:var(--km7-gold)">CAFÉ</span></div>
    <div style="width:30px"></div>
</header>

<div id="loader"><div class="spinner-border text-dark mb-2"></div><h6>KM7 COFFEE</h6></div>

<div class="container">
    <div id="sec-venta" class="view-section active-section">
        <h5 class="fw-bold mb-3">Nueva Orden</h5>
        <div class="card-custom">
            <label style="font-size:10px; font-weight:800; color:var(--km7-gold)">CLIENTE</label>
            <select id="clienteSel" class="form-select border-0 bg-light mb-3"></select>
            <div class="d-flex gap-2 mb-3">
                <select id="prodSel" class="form-select border-0 bg-light"></select>
                <input type="number" id="cant" class="form-control w-25 border-0 bg-light text-center" value="1">
                <button class="btn btn-dark" onclick="addItem()"><i class="bi bi-plus"></i></button>
            </div>
            <div class="row g-2">
                <div class="col-6"><select id="estadoEntrega" class="form-select border-0 bg-light"><option>Pendiente</option><option>Entregado</option></select></div>
                <div class="col-6"><select id="estadoPago" class="form-select border-0 bg-light" onchange="document.getElementById('divMedio').classList.toggle('hidden', this.value!='Pagado')"><option>Pendiente</option><option>Pagado</option></select></div>
            </div>
            <div id="divMedio" class="mt-2 hidden"><select id="medioPago" class="form-select border-0 bg-light"><option>Efectivo</option><option>Transferencia</option></select></div>
            <input type="text" id="notaVenta" class="form-control border-0 bg-light mt-3" placeholder="Notas...">
        </div>
        <div id="listaItems"></div>
        <div class="card-custom bg-dark text-white d-flex justify-content-between align-items-center mt-3">
            <div><small>TOTAL</small><h3 class="m-0">$<span id="totalVenta">0</span></h3></div>
            <button class="btn btn-km7 w-auto px-4" style="background:var(--km7-gold)" onclick="enviarVenta()">LISTO</button>
        </div>
    </div>

    <div id="sec-historial" class="view-section">
        <h5 class="fw-bold mb-3">Registro</h5>
        <div class="d-flex gap-2 mb-3">
            <input type="text" id="busqHist" class="form-control border-0 bg-white shadow-sm" placeholder="Buscar cliente..." oninput="renderHist()">
            <button class="btn btn-white shadow-sm" onclick="toggleFiltroPend()"><i class="bi bi-filter"></i></button>
        </div>
        <div id="contenedorHistorial"></div>
    </div>

    <div id="sec-crm" class="view-section">
        <h5 class="fw-bold mb-3">Prospectos</h5>
        <div id="listaP"></div>
    </div>

    <div id="sec-caja" class="view-section">
        <div class="row g-2 mb-3">
            <div class="col-6"><div class="card-custom bg-dark text-white p-3"><small class="opacity-75">CAJA REAL</small><h4 id="cajaSaldo" class="m-0">$0</h4></div></div>
            <div class="col-6"><div class="card-custom p-3 border-start border-warning border-4" onclick="toggleDeudas()"><small class="text-muted">DEUDAS</small><h4 id="cajaPendiente" class="m-0 text-warning">$0</h4></div></div>
        </div>
        
        <div class="card-custom mb-3 p-3">
            <h6 class="fw-bold mb-2" style="font-size:12px">ESTADÍSTICAS KM7</h6>
            <div class="d-flex justify-content-between"><small>Top Producto:</small><b id="topProd">...</b></div>
        </div>

        <button class="btn btn-outline-danger w-100 mb-3" onclick="modGasto.show()">+ GASTO</button>
        <div id="listaDeudas" class="hidden mb-3"><div id="contenedorDeudas"></div></div>
        <div id="listaMovs"></div>
    </div>
</div>

<nav class="nav-bottom">
    <button class="nav-item active" onclick="ver('sec-venta', this)"><i class="bi bi-cup-hot"></i>Venta</button>
    <button class="nav-item" onclick="ver('sec-historial', this); loadHist();"><i class="bi bi-receipt"></i>Ventas</button>
    <button class="nav-item" onclick="ver('sec-crm', this); loadCRM();"><i class="bi bi-person"></i>CRM</button>
    <button class="nav-item" onclick="ver('sec-caja', this); loadCaja();"><i class="bi bi-wallet2"></i>Caja</button>
</nav>

<div class="modal fade" id="modEditItem" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4"><h6 class="fw-bold">Editar Item</h6><input type="number" id="editCant" class="form-control mb-2"><input type="number" id="editPrecio" class="form-control mb-3"><button class="btn btn-km7" onclick="saveEditItem()">Actualizar</button></div></div></div>
<div class="modal fade" id="modGasto" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4"><h6 class="fw-bold">Gasto</h6><input type="number" id="gMonto" class="form-control mb-2" placeholder="Monto"><input type="text" id="gNota" class="form-control mb-3" placeholder="Concepto"><button class="btn btn-danger w-100" onclick="guardarGasto()">REGISTRAR</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxq69gkGczhOf683lUZXDpPPAofrcZSOdhFBvijAou44ZGFYadgeIrH_zG_SwlJtBuc/exec";
    let productos = [], clientes = [], carrito = [], histData = [], editingIdx = -1, soloPendientes = false;
    const modEditItem = new bootstrap.Modal('#modEditItem');
    const modGasto = new bootstrap.Modal('#modGasto');

    function callAPI(action, data = null, id = null, extra = null, val = null) {
        return new Promise((resolve) => {
            const cb = 'jsonp_' + Math.round(100000 * Math.random());
            window[cb] = (res) => { delete window[cb]; document.body.removeChild(s); resolve(res); };
            let url = `${API_URL}?action=${action}&callback=${cb}`;
            if (data) url += `&data=${encodeURIComponent(JSON.stringify(data))}`;
            if (id) url += `&id=${id}`;
            if (extra) url += `&tipo=${extra}`;
            if (val) url += `&valor=${val}`;
            const s = document.createElement('script'); s.src = url; document.body.appendChild(s);
        });
    }

    window.onload = async () => {
        const d = await callAPI('getFormData');
        productos = d.productos; clientes = d.clientes;
        document.getElementById('clienteSel').innerHTML = clientes.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
        document.getElementById('prodSel').innerHTML = productos.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
        document.getElementById('loader').style.display = 'none';
    };

    function addItem() {
        const prod = productos.find(p => p[0] == document.getElementById('prodSel').value);
        const clie = clientes.find(c => c[0] == document.getElementById('clienteSel').value);
        const p = parseFloat(clie[2] === "Mayorista" ? prod[6] : prod[5]);
        carrito.push({ idProd: prod[0], nombre: prod[1], cant: document.getElementById('cant').value, precio: p, subtotal: p * document.getElementById('cant').value });
        renderCar();
    }

    function renderCar() {
        let h = '', st = 0;
        carrito.forEach((i, idx) => { st += i.subtotal; h += `<div class="card-custom py-2 d-flex justify-content-between align-items-center mb-2" onclick="openEditItem(${idx})"><span><b>${i.nombre}</b> x${i.cant}</span><b>$${i.subtotal}</b></div>`; });
        document.getElementById('listaItems').innerHTML = h; document.getElementById('totalVenta').innerText = st;
    }

    function openEditItem(idx) { editingIdx = idx; document.getElementById('editCant').value = carrito[idx].cant; document.getElementById('editPrecio').value = carrito[idx].precio; modEditItem.show(); }
    function saveEditItem() { carrito[editingIdx].cant = document.getElementById('editCant').value; carrito[editingIdx].precio = document.getElementById('editPrecio').value; carrito[editingIdx].subtotal = carrito[editingIdx].cant * carrito[editingIdx].precio; renderCar(); modEditItem.hide(); }

    async function loadHist() { histData = await callAPI('getHistorial'); renderHist(); }
    function toggleFiltroPend() { soloPendientes = !soloPendientes; renderHist(); }
    function renderHist() {
        const b = document.getElementById('busqHist').value.toLowerCase();
        document.getElementById('contenedorHistorial').innerHTML = histData
            .filter(v => v.clienteNombre.toLowerCase().includes(b))
            .filter(v => !soloPendientes || v.entrega === 'Pendiente')
            .map(v => `
            <div class="hist-card ${v.entrega==='Entregado'?'listo-entrega':'pend-entrega'}">
                <div class="d-flex justify-content-between"><b>${v.clienteNombre}</b><b>$${v.total}</b></div>
                <div class="my-2"><span class="status-pill ${v.pago==='Pagado'?'pill-pagado':'pill-pendiente'}">${v.pago}</span></div>
                <div class="d-flex gap-2">
                    <button class="btn-action-small" onclick="toggleStatusVenta('${v.id}','pago','${v.pago}')"><i class="bi bi-cash"></i></button>
                    <button class="btn-action-small" onclick="toggleStatusVenta('${v.id}','entrega','${v.entrega}')"><i class="bi bi-truck"></i></button>
                    <button class="btn-action-small" style="color:#25D366" onclick="shareVenta('${v.clienteNombre}','${v.total}','${v.pago}','${v.entrega}','${v.clienteTel}')"><i class="bi bi-whatsapp"></i></button>
                </div>
            </div>`).join('');
    }

    async function toggleStatusVenta(id, tipo, val) {
        const nv = (tipo==='pago') ? (val==='Pagado'?'Pendiente':'Pagado') : (val==='Entregado'?'Pendiente':'Entregado');
        await callAPI('updateStatusVenta', null, id, tipo, nv); loadHist();
    }

    function shareVenta(n, t, p, e, tel) {
        const msg = encodeURIComponent(`*KM7 COFFEE*\nHola ${n}!\nTotal: $${t}\nPago: ${p}\nEntrega: ${e}`);
        window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
    }

    async function loadCaja() {
        const d = await callAPI('getCaja');
        document.getElementById('cajaSaldo').innerText = '$' + d.saldoActual.toLocaleString();
        document.getElementById('cajaPendiente').innerText = '$' + d.pendienteCobro.toLocaleString();
        document.getElementById('topProd').innerText = d.topProducto;
        document.getElementById('listaMovs').innerHTML = d.movimientos.map(m => `<div class="card-custom py-2 d-flex justify-content-between border-start border-4 ${m.tipo=='Egreso'?'border-danger':'border-success'}"><span>${m.descripcion}</span><b>$${m.monto}</b></div>`).join('');
        document.getElementById('contenedorDeudas').innerHTML = d.detallesPendientes.map(p => `<div class="small p-2 bg-white mb-1 rounded">${p.cliente}: $${p.monto}</div>`).join('');
    }

    async function enviarVenta() {
        document.getElementById('loader').style.display='flex';
        await callAPI('registrarVenta', { idCliente: document.getElementById('clienteSel').value, total: document.getElementById('totalVenta').innerText, estadoPago: document.getElementById('estadoPago').value, estadoEntrega: document.getElementById('estadoEntrega').value, medioPago: document.getElementById('medioPago').value, nota: document.getElementById('notaVenta').value, items: carrito });
        location.reload();
    }

    async function guardarGasto() {
        await callAPI('registrarGasto', { categoria: 'Gasto', monto: document.getElementById('gMonto').value, nota: document.getElementById('gNota').value, medioPago: 'Efectivo' });
        modGasto.hide(); loadCaja();
    }

    function ver(id, el) { 
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
    function toggleDeudas() { document.getElementById('listaDeudas').classList.toggle('hidden'); }
</script>
</body>
</html>
