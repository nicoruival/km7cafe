<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Km7 Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --km7-brown: #4e342e; }
        body { background: #f4f4f4; padding-bottom: 80px; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 10px; color: #888; border: none; background: none; font-size: 0.8rem; }
        .nav-item.active { color: var(--km7-brown); font-weight: bold; }
        .nav-item i { font-size: 1.5rem; display: block; }
        .view-section { display: none; padding: 20px; }
        .active-section { display: block; }
        .card-custom { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .btn-km7 { background: var(--km7-brown); color: white; border-radius: 8px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay">
    <div class="spinner-border text-brown"></div>
</div>

<div class="container">
    <div id="sec-venta" class="view-section active-section">
        <h4 class="fw-bold mb-3">☕ Nueva Venta</h4>
        <div class="card-custom">
            <label class="small fw-bold">CLIENTE</label>
            <select id="clienteSel" class="form-select mb-3 border-0 bg-light"></select>
            <label class="small fw-bold">PRODUCTO</label>
            <div class="d-flex gap-2 mb-2">
                <select id="prodSel" class="form-select border-0 bg-light"></select>
                <input type="number" id="cant" class="form-control w-25 border-0 bg-light" value="1">
                <button class="btn btn-km7" onclick="addItem()">+</button>
            </div>
            <input type="text" id="notaVenta" class="form-control border-0 bg-light mt-2" placeholder="Notas...">
        </div>
        <div id="listaItems" class="mb-3"></div>
        <div class="card-custom bg-dark text-white d-flex justify-content-between align-items-center">
            <div><small>Total</small><h4 class="m-0">$<span id="totalVenta">0</span></h4></div>
            <button class="btn btn-km7" onclick="enviarVenta()">LISTO</button>
        </div>
    </div>

    <div id="sec-historial" class="view-section">
        <h4 class="fw-bold mb-3">Ventas Recientes</h4>
        <div id="contenedorHistorial"></div>
    </div>

    <div id="sec-crm" class="view-section">
        <div class="d-flex justify-content-between">
            <h4 class="fw-bold">CRM</h4>
            <button class="btn btn-sm btn-km7" onclick="modNP.show()">+ Nuevo</button>
        </div>
        <div id="listaP" class="mt-3"></div>
    </div>

    <div id="sec-caja" class="view-section text-center">
        <div class="card-custom bg-km7 text-white p-4 mb-3" style="background: #4e342e;">
            <small>SALDO CAJA</small>
            <h1 id="cajaSaldo" class="fw-bold">$0</h1>
        </div>
        <div id="listaMovs"></div>
    </div>
</div>

<nav class="nav-bottom">
    <button class="nav-item active" onclick="ver('sec-venta', this)"><i class="bi bi-plus-circle"></i>Venta</button>
    <button class="nav-item" onclick="ver('sec-historial', this); loadHist();"><i class="bi bi-receipt"></i>Historial</button>
    <button class="nav-item" onclick="ver('sec-crm', this); loadCRM();"><i class="bi bi-people"></i>CRM</button>
    <button class="nav-item" onclick="ver('sec-caja', this); loadCaja();"><i class="bi bi-wallet2"></i>Caja</button>
</nav>

<div class="modal fade" id="modQV" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-3">
    <input type="hidden" id="qvId">
    <h6>Actualizar Venta</h6>
    <select id="qvPago" class="form-select mb-2"><option>Pagado</option><option>Pendiente</option></select>
    <select id="qvEntrega" class="form-select mb-3"><option>Entregado</option><option>Pendiente</option></select>
    <button class="btn btn-km7 w-100" onclick="updateVta()">Guardar</button>
</div></div></div>

<script>
    let productos = [], clientes = [], prospectos = [], carrito = [];

    window.onload = () => { init(); };

    function init() {
        google.script.run
            .withSuccessHandler(d => {
                productos = d.productos;
                clientes = d.clientes;
                prospectos = d.prospectos;
                document.getElementById('clienteSel').innerHTML = clientes.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
                document.getElementById('prodSel').innerHTML = productos.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
                document.getElementById('loader').style.display = 'none';
            })
            .withFailureHandler(err => { alert("Error al cargar: " + err); })
            .getFormData();
    }

    function addItem() {
        const idC = document.getElementById('clienteSel').value;
        const idP = document.getElementById('prodSel').value;
        const clie = clientes.find(c => c[0] == idC);
        const prod = productos.find(p => p[0] == idP);
        
        // CORRECCIÓN DE ÍNDICE: En tu sheet el tipo es columna 3 (índice 2)
        const esMayorista = clie && clie[2] === "Mayorista";
        const precio = parseFloat(esMayorista ? prod[6] : prod[5]);
        const cant = parseFloat(document.getElementById('cant').value);

        carrito.push({ idProd: idP, nombre: prod[1], cant, precio, subtotal: cant * precio });
        renderCar();
    }

    function renderCar() {
        let h = '', t = 0;
        carrito.forEach((i, idx) => {
            t += i.subtotal;
            h += `<div class="card-custom py-2 d-flex justify-content-between align-items-center">
                <span>${i.nombre} (x${i.cant})</span>
                <b>$${i.subtotal.toLocaleString()}</b>
                <i class="bi bi-x-circle text-danger" onclick="carrito.splice(${idx},1);renderCar()"></i>
            </div>`;
        });
        document.getElementById('listaItems').innerHTML = h;
        document.getElementById('totalVenta').innerText = t.toLocaleString();
    }

    function enviarVenta() {
        if(!carrito.length) return;
        const d = {
            idCliente: document.getElementById('clienteSel').value,
            total: document.getElementById('totalVenta').innerText,
            estadoPago: 'Pendiente',
            estadoEntrega: 'Pendiente',
            nota: document.getElementById('notaVenta').value,
            items: carrito
        };
        google.script.run.withSuccessHandler(res => {
            alert(res); carrito = []; renderCar();
        }).registrarVenta(d);
    }

    function loadHist() {
        google.script.run.withSuccessHandler(d => {
            document.getElementById('contenedorHistorial').innerHTML = d.map(v => `
                <div class="card-custom" onclick="openQV('${v.id}','${v.pago}','${v.entrega}')">
                    <div class="d-flex justify-content-between"><b>${v.clienteNombre}</b> <small>${v.pago}</small></div>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="badge bg-light text-dark">${v.entrega}</span>
                        <h5 class="m-0">$${v.total}</h5>
                    </div>
                </div>`).join('');
        }).getHistorialCompleto();
    }

    function loadCRM() {
        // En tu sheet el estado "Activo" está en la columna 6 (índice 5)
        document.getElementById('listaP').innerHTML = prospectos.map(p => `
            <div class="card-custom border-start border-4 ${p[7]=='caliente'?'border-danger':''}">
                <b>${p[1]}</b><br><small>${p[2]} | ${p[3]}</small>
            </div>`).join('');
    }

    function loadCaja() {
        google.script.run.withSuccessHandler(d => {
            document.getElementById('cajaSaldo').innerText = '$' + d.saldoActual.toLocaleString();
            document.getElementById('listaMovs').innerHTML = d.movimientos.map(m => `
                <div class="card-custom d-flex justify-content-between">
                    <span>${m[3]}</span><b>$${m[4]}</b>
                </div>`).join('');
        }).getDatosCaja();
    }

    function ver(id, el) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function openQV(id, p, e) {
        document.getElementById('qvId').value = id;
        document.getElementById('qvPago').value = p;
        document.getElementById('qvEntrega').value = e;
        new bootstrap.Modal('#modQV').show();
    }

    function updateVta() {
        const d = { id: document.getElementById('qvId').value, pago: document.getElementById('qvPago').value, entrega: document.getElementById('qvEntrega').value };
        google.script.run.withSuccessHandler(() => { location.reload(); }).actualizarVentaCompleta(d.id, d);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
