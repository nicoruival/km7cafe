<div id="sec-caja" class="view-section">
    <div class="row g-2 mb-3">
        <div class="col-6"><div class="card-saldo bg-caja shadow-sm"><small class="opacity-75">EN CAJA</small><h4 id="cajaSaldo" class="fw-bold m-0">$0</h4></div></div>
        <div class="col-6"><div class="card-saldo bg-pendiente shadow-sm" onclick="toggleDeudas()"><small class="opacity-75">A COBRAR</small><h4 id="cajaPendiente" class="fw-bold m-0">$0</h4></div></div>
    </div>
    
    <button class="btn btn-outline-danger w-100 mb-4 rounded-3 fw-bold py-2" onclick="modGasto.show()">
        <i class="bi bi-dash-circle me-2"></i> REGISTRAR GASTO
    </button>

    <div id="listaDeudas" class="mb-4 hidden">
        <h6 class="fw-bold text-muted small">VENTAS PENDIENTES</h6>
        <div id="contenedorDeudas"></div>
    </div>
    <h6 class="fw-bold text-muted small">MOVIMIENTOS RECIENTES</h6>
    <div id="listaMovs"></div>
</div>

<div class="modal fade" id="modGasto" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4 rounded-4 border-0">
    <h5 class="fw-bold mb-3">Nuevo Gasto</h5>
    <label class="form-label-small">Categoría</label>
    <select id="gastoCat" class="form-select mb-3 bg-light border-0">
        <option>☕ Insumos (Café, Bolsas)</option>
        <option>🚚 Logística y Envío</option>
        <option>🏠 Alquiler y Servicios</option>
        <option>🛠️ Mantenimiento Tostadora</option>
        <option>📢 Marketing y Publicidad</option>
        <option>👤 Retiro Nico (Caja Chica)</option>
        <option>❓ Otros Gastos</option>
    </select>
    <label class="form-label-small">Monto ($)</label>
    <input type="number" id="gastoMonto" class="form-control mb-3 bg-light border-0" placeholder="0.00">
    <label class="form-label-small">Medio de Pago</label>
    <select id="gastoMedio" class="form-select mb-3 bg-light border-0">
        <option>Efectivo</option>
        <option>Transferencia</option>
        <option>Tarjeta</option>
    </select>
    <label class="form-label-small">Nota / Detalle</label>
    <input type="text" id="gastoNota" class="form-control mb-4 bg-light border-0" placeholder="Ej: Pago de gas, Repuestos...">
    <button class="btn btn-danger w-100 py-3 fw-bold rounded-3" onclick="guardarGasto()">REGISTRAR SALIDA</button>
</div></div></div>

<script>
// ... (Dentro del script, añadir estas funciones) ...
const modGasto = new bootstrap.Modal('#modGasto');

async function guardarGasto() {
    const m = document.getElementById('gastoMonto').value;
    if(!m || m <= 0) return alert("Ingresa un monto válido");
    
    document.getElementById('loader').style.display = 'flex';
    await callAPI('registrarGasto', {
        categoria: document.getElementById('gastoCat').value,
        monto: m,
        medioPago: document.getElementById('gastoMedio').value,
        nota: document.getElementById('gastoNota').value
    });
    modGasto.hide();
    loadCaja();
    document.getElementById('loader').style.display = 'none';
    // Limpiar campos
    document.getElementById('gastoMonto').value = '';
    document.getElementById('gastoNota').value = '';
}
</script>
