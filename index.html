<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Km7 Cafe - Vercel Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --km7: #4e342e; }
        body { background: #f4f4f4; padding-bottom: 70px; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; }
        .nav-item { flex: 1; text-align: center; padding: 10px; color: #888; text-decoration: none; font-size: 0.8rem; }
        .nav-item.active { color: var(--km7); font-weight: bold; }
        .view-section { display: none; padding: 20px; }
        .active-section { display: block; }
        .card-custom { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="app">
    <div id="sec-venta" class="view-section active-section">
        <h4 class="fw-bold mb-3">☕ Nueva Venta (Vercel)</h4>
        <div class="card-custom">
            <select id="clienteSel" class="form-select mb-2"></select>
            <div class="d-flex gap-2">
                <select id="prodSel" class="form-select"></select>
                <input type="number" id="cant" class="form-control w-25" value="1">
                <button class="btn btn-dark" onclick="addItem()">+</button>
            </div>
        </div>
        <div id="listaItems"></div>
        <div class="card-custom bg-dark text-white d-flex justify-content-between align-items-center mt-3">
            <h4 class="m-0">$<span id="totalVenta">0</span></h4>
            <button class="btn btn-primary" onclick="enviarVenta()">REGISTRAR</button>
        </div>
    </div>

    <div id="sec-historial" class="view-section">
        <h4 class="fw-bold">Ventas</h4>
        <div id="histContent"></div>
    </div>
</div>

<nav class="nav-bottom">
    <a href="#" class="nav-item active" onclick="show('sec-venta')">Venta</a>
    <a href="#" class="nav-item" onclick="show('sec-historial'); loadHist()">Historial</a>
</nav>

<script>
    // ⚠️ REEMPLAZA ESTO CON TU URL DE IMPLEMENTACIÓN DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/TU_ID_AQUI/exec";

    let productos = [], clientes = [], carrito = [];

    async function callAPI(action, data = null) {
        let url = `${API_URL}?action=${action}`;
        if (data) url += `&data=${encodeURIComponent(JSON.stringify(data))}`;
        const resp = await fetch(url);
        return await resp.json();
    }

    window.onload = async () => {
        const data = await callAPI('getFormData');
        productos = data.productos;
        clientes = data.clientes;
        document.getElementById('clienteSel').innerHTML = clientes.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
        document.getElementById('prodSel').innerHTML = productos.map(p => `<option value="${p[0]}">${p[1]}</option>`).join('');
    };

    function addItem() {
        const p = productos.find(x => x[0] == document.getElementById('prodSel').value);
        const c = clientes.find(x => x[0] == document.getElementById('clienteSel').value);
        const precio = c[2] === "Mayorista" ? parseFloat(p[6]) : parseFloat(p[5]);
        const cant = parseFloat(document.getElementById('cant').value);
        carrito.push({ idProd: p[0], nombre: p[1], cant, precio, subtotal: cant * precio });
        renderCar();
    }

    function renderCar() {
        let t = 0;
        document.getElementById('listaItems').innerHTML = carrito.map(i => {
            t += i.subtotal;
            return `<div class="card-custom"><b>${i.nombre}</b> x${i.cant} - $${i.subtotal}</div>`;
        }).join('');
        document.getElementById('totalVenta').innerText = t.toLocaleString();
    }

    async function enviarVenta() {
        const d = {
            idCliente: document.getElementById('clienteSel').value,
            total: document.getElementById('totalVenta').innerText,
            estadoPago: 'Pendiente',
            estadoEntrega: 'Pendiente',
            items: carrito
        };
        const res = await callAPI('registrarVenta', d);
        alert(res.message);
        carrito = []; renderCar();
    }

    async function loadHist() {
        const h = await callAPI('getHistorial');
        document.getElementById('histContent').innerHTML = h.map(v => `<div class="card-custom"><b>${v.cliente}</b> - $${v.total}</div>`).join('');
    }

    function show(id) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
    }
</script>
</body>
</html>
